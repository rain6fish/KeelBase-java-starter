# Test-only override: the signing secret the contract test needs.
# A properties file is loaded *alongside* the main application.yml (and wins on conflicts);
# a same-named application.yml in test resources would shadow the main one entirely.
# It is deliberately absent from src/main/resources so a deployed project fails fast
# instead of accepting tokens signed with a value published in this repository.
#
# 仅测试用覆盖：契约测试需要的签名密钥。properties 文件与主 application.yml **同时**加载
# （冲突时以后者为准）；同名 application.yml 放进测试资源会把主配置整个遮蔽。
# 它刻意不出现在 src/main/resources，故部署的项目会快速失败，而不是接受用本仓公开值签出的令牌。
keelbase.delegation.secret=0123456789012345678901234567890123456789012345678901234567890123
