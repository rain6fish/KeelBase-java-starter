// 根构建脚本：Java 17 + Spring Boot 依赖 BOM 管理。
// Maven 仍是主构建（CI/发布走 mvn），Gradle 提供平行开发/发布体验（roadmap「Maven Central + Gradle 发布」）。
// 依赖与各模块 pom.xml 保持一一对应（compile → api / provided → compileOnly / runtime → runtimeOnly）。

plugins {
    id 'org.springframework.boot' version '3.5.16' apply false
    id 'io.spring.dependency-management' version '1.1.4' apply false
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'

    group = rootProject.group
    version = rootProject.version

    repositories {
        maven { url 'https://maven.aliyun.com/repository/public' }
        mavenCentral()
    }

    dependencyManagement {
        imports {
            mavenBom 'org.springframework.boot:spring-boot-dependencies:3.5.16'
        }
        // Spring Boot BOM 不管 jjwt；对齐 Maven 父 pom 的 dependencyManagement（jjwt.version）
        dependencies {
            dependency 'io.jsonwebtoken:jjwt-api:0.11.5'
            dependency 'io.jsonwebtoken:jjwt-impl:0.11.5'
            dependency 'io.jsonwebtoken:jjwt-jackson:0.11.5'

            // Same lift as the parent pom, expressed as explicit pins. Unlike Maven, where the first
            // BOM import wins, Gradle resolves to the highest version and an earlier mavenBom import
            // does not override the Boot BOM — pinning each artifact is what actually moves it.
            // Jackson 2.21.7 and Log4j 2.25.5 are the advisories a version bump can still clear
            // without moving to Spring Boot 4, which Framework 6.2's end of line would force.
            // 与父 pom 同样的抬升，这里写成显式钉版本。Maven 里先导入的 BOM 先生效，Gradle 则取最高版本，
            // 排在前面导入 Boot BOM 之后并不覆写 —— 真正起作用的是逐个钉版本。
            // Jackson 2.21.7 与 Log4j 2.25.5 是不搬去 Spring Boot 4 仍能清掉的公告。
            dependency 'com.fasterxml.jackson.core:jackson-core:2.21.7'
            dependency 'com.fasterxml.jackson.core:jackson-databind:2.21.7'
            dependency 'com.fasterxml.jackson.core:jackson-annotations:2.21'
            dependency 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8:2.21.7'
            dependency 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.21.7'
            dependency 'com.fasterxml.jackson.module:jackson-module-parameter-names:2.21.7'
            dependency 'org.apache.logging.log4j:log4j-api:2.25.5'
            dependency 'org.apache.logging.log4j:log4j-to-slf4j:2.25.5'
            // Tomcat publishes no BOM, so its embedded artifacts are pinned individually. 10.1.61
            // stays on the 10.1 line Boot 3.5.x targets — a patch-level move, not the container swap
            // Spring Boot 4 makes by moving to Tomcat 11.
            // Tomcat 没有 BOM，内嵌 artifact 只能逐个钉。10.1.61 仍在 Boot 3.5.x 的 10.1 线上 ——
            // 这是一次补丁级移动，不是 Spring Boot 4 换到 Tomcat 11 那种容器换代。
            dependency 'org.apache.tomcat.embed:tomcat-embed-core:10.1.61'
            dependency 'org.apache.tomcat.embed:tomcat-embed-el:10.1.61'
            dependency 'org.apache.tomcat.embed:tomcat-embed-websocket:10.1.61'
        }
    }

    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-parameters']   // 对齐 Maven compiler <parameters>true</parameters>
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}
