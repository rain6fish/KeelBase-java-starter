name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test (Maven JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      # Both legs report even when one fails; otherwise a red 17 leg cancels 21 and the matrix
      # never answers whether 21 works.
      # 两条腿各自报结果；否则 17 一红就把 21 取消掉，矩阵永远答不出 21 行不行。
      fail-fast: false
      matrix:
        java: ['17', '21']    # 17 = 运行时基线；21 = LTS 兼容验证（企业 Java 栈多用 21）
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build & test (all modules)
        run: mvn -B install

      # Assert the JVM the build just ran on actually carries the fixed JSSE implementations, so a
      # downgraded or substituted JDK cannot pass unnoticed.
      # 断言构建刚跑过的 JVM 确实带修复版 JSSE 实现，免得 JDK 被降级或替换却无人察觉。
      - name: Assert the JDK build carries the JSSE fixes
        run: bash scripts/assert-jdk-build.sh

  gradle:
    name: Build & Test (Gradle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build & test (all modules)
        run: ./gradlew build --no-daemon

      - name: Assert the JDK build carries the JSSE fixes
        run: bash scripts/assert-jdk-build.sh

  dependency-scan:
    name: Known advisories in the dependency tree
    runs-on: ubuntu-latest
    # Reports, never gates. The tree resolves to Spring Framework 6.2.19 and Jackson 2.21.4, both
    # carrying open advisories whose fix is a parent-pom bump rather than a change in this
    # repository; a blocking gate here would redden every push for something no PR on this branch
    # can clear. Findings land in the job summary; the follow-up is tracked, not enforced.
    # 只报告，不设闸。依赖树解析到 Spring Framework 6.2.19 与 Jackson 2.21.4，二者都带着未清的公告，
    # 修法是父 pom 抬版本、不在本仓的改动；在这里设硬闸会让每次推送都因本分支改不掉的事变红。
    # 结果写入 job summary；后续作为待办跟踪，不在这里强制。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # Pinned and checksum-verified rather than borrowed from a marketplace action: this job's
      # output is read as security signal, so the scanner should be the exact binary we named.
      # 钉版本并校验哈希，而不是借一个 marketplace action：这一步的输出被当作安全信号读，
      # 扫描器就该是我们点名的那一个二进制。
      - name: Fetch osv-scanner 2.7.0
        run: |
          set -euo pipefail
          base=https://github.com/google/osv-scanner/releases/download/v2.7.0
          curl -fsSLo osv-scanner "$base/osv-scanner_linux_amd64"
          curl -fsSLo SHA256SUMS "$base/osv-scanner_SHA256SUMS"
          grep 'osv-scanner_linux_amd64$' SHA256SUMS | sha256sum -c -
          chmod +x osv-scanner

      - name: Scan every pom.xml against the OSV database
        run: |
          set +e
          ./osv-scanner scan source -r --format markdown --verbosity error . > "$RUNNER_TEMP/osv-report.md"
          status=$?
          cat "$RUNNER_TEMP/osv-report.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  family-block:
    name: The generated family section still matches its stamp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The "KeelBase family" section at the top of each README is generated in the main repository,
      # and each copy carries a sha256 of its own body on its BEGIN line. That is what lets this check
      # run here with no sibling checkout and no network — the only shape that works for a gate that
      # has to live in every repository of the family separately. A copy that stops matching its stamp
      # was hand-edited; edit docs/ecosystem.md in the main repository and sync instead.
      #
      # 每个 README 开头的「KeelBase 家族」段在主仓生成，每一份都在 BEGIN 行带着自身内容的 sha256。
      # 正因如此，这道检查才能在这里、在不检出兄弟仓、不联网的前提下跑 —— 对一道必须分别住在家族每个仓里的
      # 闸来说，这是唯一行得通的形状。副本一旦不再与戳相符，就是被手改过；改主仓的 docs/ecosystem.md 再同步。
      - name: The family section in the READMEs must match its stamp
        run: node scripts/check-family-block.mjs
